<style>
:root {

  white-space: nowrap;
  letter-spacing: -0.6px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  border: 1px solid #e2e8f0;
  min-width: 0;
}

  margin-top: 10px;

}

  font-weight: 700;
  color: #64748b;

}

.exempt-tier-badge {
  font-weight: 700;

.exempt-player-list {
  display: flex;

  gap: 4px;
}

.notice-box {
  padding: 12px 16px;
  background: #fef2f2;
  border: 1px solid #fecaca;
  color: #b91c1c;
  border-radius: 8px;
  margin-top: 14px;
  display: none;
  font-size: 0.95rem;
}
</style>
</head>

<body>
<div class="container">
  <div class="card">
    <div class="card-title">
      <span>👥 참석자 명단 및 불참/제외 선택</span>
      <span style="font-size: 0.85rem; font-weight: normal; color: #64748b;">(행을 클릭하여 제외 설정)</span>
    </div>

    <table class="absent-table">
      <thead>
        <tr>
          <th>이름</th>
          <th>티어</th>
          <th>상태</th>
          <th>제외</th>
        </tr>
      </thead>
      <tbody id="playerTable"></tbody>
    </table>

    <div id="noticeBox" class="notice-box"></div>

    <div class="controls-row">
      <div class="font-control">
        <span>결과 폰트:</span>
        <input type="range" min="9" max="15" value="11" oninput="changeFont(this.value)">
        <span id="fontVal" style="font-weight: bold; min-width: 28px;">11px</span>
      </div>

      <div class="btn-group">
        <button class="btn-reset" onclick="resetAll()">초기화</button>
        <button class="btn-generate" onclick="generate()">팀 분배 생성</button>
      </div>
    </div>
  </div>

  <div id="result"></div>
</div>

<script>
// 3티어에 '동수' 포함 총 16명
const INITIAL_TIERS = {
  1: ["준식", "세준", "형욱", "재현", "수현"],
  2: ["경식", "종화", "서영", "중서", "민우"],
  3: ["동훈", "찬규", "정섭", "덕명", "요성", "동수"]
};

function buildTable() {
  let html = "";
  for (let t in INITIAL_TIERS) {
    INITIAL_TIERS[t].forEach(name => {
      html += `
      <tr class="player-row" onclick="handleRowClick(this, event)">
        <td><span class="player-name">${name}</span></td>
        <td><span class="tier-tag tier-${t}">${t}티어</span></td>
        <td><span class="status-badge">참석</span></td>
        <td>
          <input type="checkbox" value="${name}" onclick="handleCheckboxClick(this, event)">
        </td>
      </tr>`;
    });
  }
  document.getElementById("playerTable").innerHTML = html;
}
buildTable();

function handleRowClick(row, event) {
  const checkbox = row.querySelector("input[type=checkbox]");
  if (!checkbox) return;
  checkbox.checked = !checkbox.checked;
  syncRowVisual(row, checkbox.checked);
}

function handleCheckboxClick(checkbox, event) {
  event.stopPropagation();
  const row = checkbox.closest("tr");
  if (row) {
    syncRowVisual(row, checkbox.checked);
  }
}

function syncRowVisual(row, isChecked) {
  const badge = row.querySelector(".status-badge");
  if (isChecked) {
    row.classList.add("selected");
    if (badge) badge.innerText = "제외됨";
  } else {
    row.classList.remove("selected");
    if (badge) badge.innerText = "참석";
  }
}

function changeFont(size) {
  document.documentElement.style.setProperty('--result-font', size + 'px');
  document.getElementById("fontVal").innerText = size + 'px';
}

function showNotice(msg) {
  const box = document.getElementById("noticeBox");
  box.innerText = msg;
  box.style.display = "block";
}

function hideNotice() {
  const box = document.getElementById("noticeBox");
  box.style.display = "none";
}

function shuffle(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function autoGenerateMapping(parts) {
  let t1 = parts[1].length;
  let t2 = parts[2].length;
  let t3 = parts[3].length;
  let tiers = [t1, t2, t3];

  if (tiers.includes(2)) {
    return [
      [2, 2, 1],
      [2, 2, 1],
      [2, 2, 1]
    ];
  }

  if (tiers.includes(3)) {
    return [
      tiers.map(t => (t >= 4 ? 2 : 1)),
      tiers.map(t => (t >= 4 ? 2 : 1)),
      tiers.map(t => (t >= 4 ? 2 : 1))
    ];
  }

  return [
    [1, 2, 2],
    [2, 1, 2],
    [2, 2, 1]
  ];
}

function pickExempt(players, needed, used) {
  let cnt = players.length - needed;
  if (cnt <= 0) return [];

  let pool = shuffle(players);
  let never = pool.filter(p => !used.has(p));

  if (never.length >= cnt) {
    return shuffle(never).slice(0, cnt);
  }

  let chosen = [...never];
  let remain = pool.filter(p => !chosen.includes(p));
  return chosen.concat(shuffle(remain).slice(0, cnt - chosen.length));
}

function generate() {
  hideNotice();
  let absent = new Set();
  document.querySelectorAll("input[type=checkbox]").forEach(c => {
    if (c.checked) absent.add(c.value);
  });

  let parts = { 1: [], 2: [], 3: [] };
  let totalAttending = 0;

  for (let t in INITIAL_TIERS) {
    INITIAL_TIERS[t].forEach(p => {
      if (!absent.has(p)) {
        parts[t].push(p);
        totalAttending++;
      }
    });
  }

  if (totalAttending < 10) {
    showNotice(`현재 참석 인원이 ${totalAttending}명입니다. 최소 10명 이상이어야 경기를 생성할 수 있습니다.`);
    return;
  }

  let specs = autoGenerateMapping(parts);
  let allExempt = { 1: new Set(), 2: new Set(), 3: new Set() };
  let html = "<div class='card'><h3 style='margin-top:0;'>🎯 3개 게임 팀 분배 결과</h3>";

  specs.forEach((spec, i) => {
    let on = [], off = [], exempt = {};

    for (let t = 1; t <= 3; t++) {
      let need = spec[t - 1] * 2;
      let ex = pickExempt(parts[t], need, allExempt[t]);
      exempt[t] = ex;

      let pool = parts[t].filter(p => !ex.includes(p));
      pool = shuffle(pool);

      on = on.concat(pool.slice(0, spec[t - 1]));
      off = off.concat(pool.slice(spec[t - 1], spec[t - 1] * 2));

      ex.forEach(x => allExempt[t].add(x));
    }

    html += `
    <div class="game-card">
      <div class="game-title">⚔️️ Game ${i + 1}</div>

      <div class="team-scroll-container">
        <div class="team-box">
          <div class="team on">
            <div class="team-header">🔵 ON 팀</div>
            <div class="player-list">
              ${on.map(p => `<span class="player">${p}</span>`).join("")}
            </div>
          </div>
          <div class="team off">
            <div class="team-header">🔴 OFF 팀</div>
            <div class="player-list">
              ${off.map(p => `<span class="player">${p}</span>`).join("")}
            </div>
          </div>
        </div>
      </div>

      <div class="exempt-box">
        <div class="exempt-title">☕ 휴식 인원 (Exempt)</div>
        ${Object.entries(exempt).map(([t, v]) => `
          <div class="exempt-tier-row">
            <span class="exempt-tier-badge">${t}티어:</span>
            <div class="exempt-player-list">
              ${v.length ? v.map(p => `<span class="player" style="padding: 3px 6px;">${p}</span>`).join("") : "<span style='color:#94a3b8; font-size:10px;'>없음</span>"}
            </div>
          </div>
        `).join("")}
      </div>
    </div>`;
  });

  html += "</div>";
  document.getElementById("result").innerHTML = html;
}

function resetAll() {
  hideNotice();
  document.querySelectorAll("input[type=checkbox]").forEach(c => (c.checked = false));
  document.querySelectorAll("#playerTable tr.player-row").forEach(r => syncRowVisual(r, false));
  document.getElementById("result").innerHTML = "";
}
</script>
</body>
</html>
```
