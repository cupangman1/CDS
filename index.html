<body>
<div class="container">
  <div class="card">
    <div class="card-title">
      <span>👥 참석자 명단 및 불참/제외 선택</span>
      <span style="font-size: 0.85rem; font-weight: normal; color: #64748b;">(행 클릭하여 제외)</span>

    <table class="absent-table">
      <thead>

          <th>이름</th>
          <th>티어</th>
          <th>상태</th>
          <th>제외</th>
        </tr>
      </thead>

    </table>

    <!-- 면제 우선순위 모드 선택기 -->
    <div class="mode-section">
      <div class="mode-title">
        <span>🎯 면제(휴식) 우선순위 모드</span>
        <span id="currentModeLabel" style="font-weight: 600; color: #2563eb;">⚖️ 균등 분배</span>
      </div>
      <div class="mode-btn-group">
        <button type="button" class="mode-btn active" data-mode="balanced" onclick="selectMode('balanced')">
          ⚖️ 균등 분배
        </button>
        <button type="button" class="mode-btn" data-mode="tier1_rest" onclick="selectMode('tier1_rest')">
          👑 1티어 면제 다수
        </button>
        <button type="button" class="mode-btn" data-mode="tier2_rest" onclick="selectMode('tier2_rest')">
          🥈 2티어 면제 다수
        </button>
        <button type="button" class="mode-btn" data-mode="tier3_rest" onclick="selectMode('tier3_rest')">
          🥉 3티어 면제 다수
        </button>
      </div>
      <div class="mode-desc-badge">
        ✨ 전원 최소 1회 이상 휴식 보장 (어떤 경우에도 3게임 연속 출전 금지 / 최대 2게임 출전)
      </div>
    </div>

      </div>

      <div class="btn-group">
        <button class="btn-reset" onclick="resetAll()">초기화</button>
        <button class="btn-generate" onclick="generate()">팀 분배 생성</button>
      </div>
    </div>

  <div id="result"></div>

<script>
const INITIAL_TIERS = {
  1: ["준식", "세준", "형욱", "재현", "수현"],
  2: ["경식", "종화", "서영", "중서", "민우"],
  3: ["동훈", "찬규", "정섭", "덕명", "요성", "동수"]
};

let currentMode = 'balanced';

const MODE_LABELS = {
  'balanced': '⚖️ 균등 분배 (전원 최대 2게임 출전)',
  'tier1_rest': '👑 1티어 면제 다수 (1티어 우선 휴식)',
  'tier2_rest': '🥈 2티어 면제 다수 (2티어 우선 휴식)',
  'tier3_rest': '🥉 3티어 면제 다수 (3티어 우선 휴식)'
};

function selectMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mode === mode);
  });
  document.getElementById('currentModeLabel').innerText = MODE_LABELS[mode] || mode;
}

function buildTable() {
  let html = "";
  for (let t in INITIAL_TIERS) {
    INITIAL_TIERS[t].forEach(name => {
      html += `
      <tr class="player-row" onclick="handleRowClick(this, event)">
        <td><span class="player-name">${name}</span></td>
        <td><span class="tier-tag tier-${t}">${t}티어</span></td>
        <td><span class="status-badge">참석</span></td>
        <td>
          <input type="checkbox" value="${name}" onclick="handleCheckboxClick(this, event)">
        </td>
      </tr>`;
    });
  }
  document.getElementById("playerTable").innerHTML = html;
}
buildTable();

function handleRowClick(row, event) {
  const checkbox = row.querySelector("input[type=checkbox]");
  if (!checkbox) return;
  checkbox.checked = !checkbox.checked;
  syncRowVisual(row, checkbox.checked);
}

function handleCheckboxClick(checkbox, event) {
  event.stopPropagation();
  const row = checkbox.closest("tr");
  if (row) {
    syncRowVisual(row, checkbox.checked);
  }
}

function syncRowVisual(row, isChecked) {
  const badge = row.querySelector(".status-badge");
  if (isChecked) {
    row.classList.add("selected");
    if (badge) badge.innerText = "제외됨";
  } else {
    row.classList.remove("selected");
    if (badge) badge.innerText = "참석";
  }
}

function changeFont(size) {
  document.documentElement.style.setProperty('--result-font', size + 'px');
  document.getElementById("fontVal").innerText = size + 'px';
}

function showNotice(msg) {
  const box = document.getElementById("noticeBox");
  box.innerText = msg;
  box.style.display = "block";
}

function hideNotice() {
  const box = document.getElementById("noticeBox");
  box.style.display = "none";
}

function shuffle(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

// 🎯 양 팀 티어 100% 동일(대칭) 유지 + "최대 2게임만 출전(3게임 출전 원천 차단)" 최적 스케줄러
function findOptimalFairSymmetricSchedule(parts, mode) {
  let N = [parts[1].length, parts[2].length, parts[3].length];
  let maxT = [
    Math.floor(N[0] / 2),
    Math.floor(N[1] / 2),
    Math.floor(N[2] / 2)
  ];

  let valids = [];
  for (let s1 = 0; s1 <= maxT[0]; s1++) {
    for (let s2 = 0; s2 <= maxT[1]; s2++) {
      let s3 = 5 - s1 - s2;
      if (s3 >= 0 && s3 <= maxT[2]) {
        valids.push([s1, s2, s3]);
      }
    }
  }

  if (valids.length === 0) return null;

  let bestSchedule = null;
  let bestScore = Infinity;

  for (let i = 0; i < valids.length; i++) {
    for (let j = 0; j < valids.length; j++) {
      for (let k = 0; k < valids.length; k++) {
        let triple = [valids[i], valids[j], valids[k]];

        // 각 티어별 3게임 총 휴식 횟수
        let tierTotalRests = [0, 1, 2].map(t => {
          let playedSlots = 2 * (triple[0][t] + triple[1][t] + triple[2][t]);
          return 3 * N[t] - playedSlots;
        });

        // 각 티어별 3게임 팀당 출전 슬롯 수 합계 (0~3게임)
        let totalPlayedSlots = [0, 1, 2].map(t => {
          return triple[0][t] + triple[1][t] + triple[2][t];
        });

        let allPlayerRests = [];
        let tierMaxDiff = 0;

        for (let t = 0; t < 3; t++) {
          let count = N[t];
          let totalR = tierTotalRests[t];
          let base = Math.floor(totalR / count);
          let rem = totalR % count;
          let tierRests = [];
          for (let p = 0; p < count; p++) {
            let r = (p < rem ? base + 1 : base);
            allPlayerRests.push(r);
            tierRests.push(r);
          }
          let diffInTier = Math.max(...tierRests) - Math.min(...tierRests);
          if (diffInTier > tierMaxDiff) tierMaxDiff = diffInTier;
        }

        let maxR = Math.max(...allPlayerRests);
        let minR = Math.min(...allPlayerRests);
        let overallRestDiff = maxR - minR;

        let score = 0;

        // 🚨 [절대 규칙 1]: 3게임 출전 원천 차단! (휴식 0회인 사람이 1명이라도 있으면 초고액 페널티 부여)
        // 15인 이상이면 무조건 전원 최소 1회 이상 휴식(최대 2게임 출전)이 보장됩니다.
        let threeGamePlayers = allPlayerRests.filter(r => r === 0).length;
        score += threeGamePlayers * 1000000;

        // 🚨 [절대 규칙 2]: 티어 내부 공정성 (같은 티어 선수들끼리 휴식 횟수 편차 1 초과 방지)
        score += tierMaxDiff * 20000;

        // 🎯 모드별 최적화 목적함수
        if (mode === 'balanced') {
          score += overallRestDiff * 1500;
          if (overallRestDiff > 1) score += 5000;

          // 게임별 티어 편차 완화
          for (let g = 0; g < 3; g++) {
            let gameEx = [
              N[0] - 2 * triple[g][0],
              N[1] - 2 * triple[g][1],
              N[2] - 2 * triple[g][2]
            ];
            let maxEx = Math.max(...gameEx);
            let minEx = Math.min(...gameEx);
            score += (maxEx - minEx) * 15;
          }
        } 
        else if (mode === 'tier1_rest') {
          // 👑 1티어 면제 다수: 1티어 출전 슬롯이 적을수록(휴식 많을수록) 점수 우대!
          // 단, 3게임 출전자 방지 페널티(+1,000,000)가 있어 2티어나 3티어에서 3게임 뛰는 사람은 절대 발생하지 않습니다.
          score += totalPlayedSlots[0] * 3000;
        } 
        else if (mode === 'tier2_rest') {
          // 🥈 2티어 면제 다수: 2티어 출전 슬롯이 적을수록(휴식 많을수록) 점수 우대!
          // 마찬가지로 1티어나 3티어에서 3게임 뛰는 인원은 원천 차단됩니다.
          score += totalPlayedSlots[1] * 3000;
        }
        else if (mode === 'tier3_rest') {
          // 🥉 3티어 면제 다수: 3티어 출전 슬롯이 적을수록(휴식 많을수록) 점수 우대!
          // 마찬가지로 1티어나 2티어가 3게임 뛰게 되는 조합은 원천 배제됩니다.
          score += totalPlayedSlots[2] * 3000;
        }

        // 3게임 연속 동일 구성 다양성 보정
        let isAllSame = (
          triple[0][0] === triple[1][0] && triple[0][1] === triple[1][1] &&
          triple[1][0] === triple[2][0] && triple[1][1] === triple[2][1]
        );
        if (isAllSame && mode === 'balanced') score += 20;

        let totalScore = score + Math.random() * 5;

        if (totalScore < bestScore) {
          bestScore = totalScore;
          bestSchedule = triple;
        }
      }
    }
  }

  return bestSchedule;
}

// 누적 휴식 횟수가 적은 사람(0회 쉰 사람)을 1순위로 선발하여 전원 최소 1회 휴식 보장
function pickFairExempt(players, neededCount, restCounts) {
  if (neededCount <= 0) return [];

  let pool = shuffle(players);
  pool.sort((a, b) => (restCounts[a] || 0) - (restCounts[b] || 0));

  let chosen = pool.slice(0, neededCount);
  chosen.forEach(p => {
    restCounts[p] = (restCounts[p] || 0) + 1;
  });

  return chosen;
}

function generate() {
  hideNotice();
  let absent = new Set();
  document.querySelectorAll("input[type=checkbox]").forEach(c => {
    if (c.checked) absent.add(c.value);
  });

  let parts = { 1: [], 2: [], 3: [] };
  let totalAttending = 0;

  for (let t in INITIAL_TIERS) {
    INITIAL_TIERS[t].forEach(p => {
      if (!absent.has(p)) {
        parts[t].push(p);
        totalAttending++;
      }
    });
  }

  if (totalAttending < 10) {
    showNotice(`현재 참석 인원이 ${totalAttending}명입니다. 최소 10명 이상이어야 경기를 생성할 수 있습니다.`);
    return;
  }

  let schedule = findOptimalFairSymmetricSchedule(parts, currentMode);

  if (!schedule) {
    showNotice("현재 인원 구성으로는 양 팀의 티어를 100% 대칭으로 맞추기 어렵습니다.");
    return;
  }

  // 개인별 상세 통계 트래커 초기화
  let playerStats = {};
  let restCounts = {};
  for (let t in parts) {
    parts[t].forEach(p => {
      restCounts[p] = 0;
      playerStats[p] = {
        name: p,
        tier: t,
        playCount: 0,
        restCount: 0,
        gameLogs: []
      };
    });
  }

  let html = `<div class='card'><h3 style='margin-top:0; display:flex; justify-content:space-between; align-items:center;'>
    <span>🎯 3개 게임 팀 분배 결과</span>
    <span style="font-size:0.8rem; font-weight:normal; color:#2563eb;">${MODE_LABELS[currentMode]}</span>
  </h3>`;

  schedule.forEach((spec, i) => {
    let on = [], off = [], exempt = {};

    for (let t = 1; t <= 3; t++) {
      let teamSlot = spec[t - 1];
      let totalNeededForGame = teamSlot * 2;
      let exemptCount = parts[t].length - totalNeededForGame;

      // 1. 공정 휴식자 선발 (0회 휴식자 최우선 선발)
      let ex = pickFairExempt(parts[t], exemptCount, restCounts);
      exempt[t] = ex;

      ex.forEach(p => {
        playerStats[p].restCount++;
        playerStats[p].gameLogs.push({ game: i + 1, role: 'REST' });
      });

      // 2. 출전 인원 셔플 후 ON/OFF 배분
      let playingPool = parts[t].filter(p => !ex.includes(p));
      playingPool = shuffle(playingPool);

      let teamOnPlayers = playingPool.slice(0, teamSlot);
      let teamOffPlayers = playingPool.slice(teamSlot, totalNeededForGame);

      teamOnPlayers.forEach(p => {
        playerStats[p].playCount++;
        playerStats[p].gameLogs.push({ game: i + 1, role: 'ON' });
      });

      teamOffPlayers.forEach(p => {
        playerStats[p].playCount++;
        playerStats[p].gameLogs.push({ game: i + 1, role: 'OFF' });
      });

      on = on.concat(teamOnPlayers);
      off = off.concat(teamOffPlayers);
    }

    // 진영 셔플 (블루/레드 쏠림 완화)
    if (Math.random() > 0.5) {
      let temp = on; on = off; off = temp;
      on.forEach(p => {
        let last = playerStats[p].gameLogs[playerStats[p].gameLogs.length - 1];
        if (last && last.game === i + 1) last.role = 'ON';
      });
      off.forEach(p => {
        let last = playerStats[p].gameLogs[playerStats[p].gameLogs.length - 1];
        if (last && last.game === i + 1) last.role = 'OFF';
      });
    }

    let specText = `1티어 ${spec[0]}명 / 2티어 ${spec[1]}명 / 3티어 ${spec[2]}명`;

    html += `
    <div class="game-card">
      <div class="game-title">
        <span>⚔ Game ${i + 1}</span>
        <span class="tier-balance-indicator">양팀 동일: ${specText}</span>
      </div>

      <div class="team-scroll-container">
        <div class="team-box">
          <div class="team on">
            <div class="team-header">🔵 ON 팀</div>
            <div class="player-list">
              ${on.map(p => `<span class="player">${p}</span>`).join("")}
            </div>
          </div>
          <div class="team off">
            <div class="team-header">🔴 OFF 팀</div>
            <div class="player-list">
              ${off.map(p => `<span class="player">${p}</span>`).join("")}
            </div>
          </div>
        </div>
      </div>

      <div class="exempt-box">
        <div class="exempt-title">☕ 휴식 인원 (Exempt)</div>
        ${Object.entries(exempt).map(([t, v]) => `
          <div class="exempt-tier-row">
            <span class="exempt-tier-badge">${t}티어:</span>
            <div class="exempt-player-list">
              ${v.length ? v.map(p => `<span class="player" style="padding: 3px 6px;">${p}</span>`).join("") : "<span style='color:#94a3b8; font-size:10px;'>없음</span>"}
            </div>
          </div>
        `).join("")}
      </div>
    </div>`;
  });

  // 요약 카드
  let playCountsSummary = {};
  Object.values(playerStats).forEach(s => {
    playCountsSummary[s.playCount] = (playCountsSummary[s.playCount] || 0) + 1;
  });
  let summaryText = Object.entries(playCountsSummary)
    .sort((a, b) => b[0] - a[0])
    .map(([cnt, players]) => `<b>${cnt}게임 출전:</b> ${players}명`)
    .join(" / ");

  html += `
  <div class="summary-card">
    📊 <b>출전 요약:</b> ${summaryText} (총 ${totalAttending}명 참석 / <b>3게임 연속 출전자: 0명</b>)
  </div>`;

  // 📋 인원별 게임 수 및 면제 수 상세 통계표 생성
  let sortedPlayers = Object.values(playerStats).sort((a, b) => {
    if (a.tier !== b.tier) return a.tier - b.tier;
    return b.playCount - a.playCount;
  });

  html += `
  <div class="stat-card">
    <div class="stat-title">
      <span>📋 인원별 게임 수 / 면제(휴식) 통계표</span>
      <span style="font-size: 0.75rem; color: #64748b; font-weight: normal;">(최대 2게임 출전)</span>
    </div>

    <table class="stat-table">
      <thead>
        <tr>
          <th>이름</th>
          <th>티어</th>
          <th>출전</th>
          <th>면제</th>
          <th>게임별 상태</th>
        </tr>
      </thead>
      <tbody>
        ${sortedPlayers.map(p => {
          let logBadges = p.gameLogs.map(g => {
            if (g.role === 'ON') return `<span class="mini-game-tag mini-tag-on">1팀</span>`;
            if (g.role === 'OFF') return `<span class="mini-game-tag mini-tag-off">2팀</span>`;
            return `<span class="mini-game-tag mini-tag-rest">휴식</span>`;
          }).join("");

          return `
          <tr>
            <td><b>${p.name}</b></td>
            <td><span class="tier-tag tier-${p.tier}">${p.tier}티어</span></td>
            <td><span class="badge-count badge-play">${p.playCount}회</span></td>
            <td><span class="badge-count badge-rest">${p.restCount}회</span></td>
            <td>${logBadges}</td>
          </tr>`;
        }).join("")}
      </tbody>
    </table>
  </div>
  </div>`;

  document.getElementById("result").innerHTML = html;
}

function resetAll() {
  hideNotice();
  document.querySelectorAll("input[type=checkbox]").forEach(c => (c.checked = false));
  document.querySelectorAll("#playerTable tr.player-row").forEach(r => syncRowVisual(r, false));
  document.getElementById("result").innerHTML = "";
}
</script>
</body>
</html>
